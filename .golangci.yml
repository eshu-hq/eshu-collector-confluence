# Shared org golangci-lint config for collector repos + SDK modules.
# Pinned to golangci-lint v2.12.2 (same binary Eshu uses).
# Org lint set only: govet, staticcheck (which subsumes gosimple in v2),
# ineffassign, unused, errcheck; formatter gofumpt. No baselines,
# no new-from-rev, no exclusions: the tree is clean under the org set,
# so any future exclusion needs a reason and a linked open issue here.
version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errcheck

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: false
