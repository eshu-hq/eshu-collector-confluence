# Publishes the collector image to GHCR when a version tag is pushed. Nothing
# else triggers it: a pull request, a branch push, or a manual run publishes
# nothing. It has no deploy step and uses no secret except GITHUB_TOKEN.
#
# Every action is pinned by full commit SHA (the comment names the tag it was
# resolved from). The image is linux/amd64 only, the platform the manifest
# artifact declares. The digest is written to the job summary: copy it into the
# activation's seed image reference.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # A grant pins the manifest version, so a tag that disagrees with it would
      # publish an image no activation can install. A pre-release suffix after
      # the first '-' (v0.1.0-rc1) is allowed on top of the manifest version.
      - name: Check the tag matches the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(awk '/^metadata:/ {in_meta=1; next} /^[^ ]/ {in_meta=0} in_meta && /^  version:/ {print $2; exit}' manifest.yaml | tr -d "\"'")"
          if [ -z "${version}" ]; then
            echo "manifest.yaml has no metadata.version" >&2
            exit 1
          fi
          if [ "${TAG}" != "v${version}" ] && [ "${TAG%%-*}" != "v${version}" ]; then
            echo "tag ${TAG} does not match manifest version ${version}: want v${version} or v${version}-<pre-release>" >&2
            exit 1
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the linux/amd64 image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: false
          sbom: false

      - name: Record the image digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### Published image"
            echo
            echo "- tag: \`${TAG}\`"
            echo "- digest reference (use this for the seed image): \`${IMAGE_REF}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Sign the image (keyless)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Verify the signature
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE_REF}" \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Generate the image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: eshu-collector-confluence.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify the attestations
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_IMAGE_REF: oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "${OCI_IMAGE_REF}" -R "${GITHUB_REPOSITORY}"
          gh attestation verify "${OCI_IMAGE_REF}" -R "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3
